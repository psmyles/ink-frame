; Ink Frame firmware (PLAN.md §9). From firmware/:
;   pio run                      build
;   pio run -t upload            build and flash (USB-C, power switch on)
;   pio device monitor           logs and the serial console (README.md)
;   pio test -e native           unit tests on the computer
;   pio run -e release           what the release workflow builds (docs/ota.md)

[platformio]
default_envs = reterminal_e1002

[env]
lib_deps =
  bblanchon/ArduinoJson@7.4.3

[env:reterminal_e1002]
platform = platformio/espressif32@7.1.3
board = seeed_xiao_esp32s3
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_ota.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 6291456
monitor_speed = 115200
monitor_filters = direct
; FW_VERSION: INKFRAME_FW_VERSION, else the development version (scripts/version.py)
extra_scripts = pre:scripts/version.py
; Logs and the serial console on UART0 (GPIO43/44, the USB-C port's CH340), not the
; ESP32-S3's own USB, which the E1002 doesn't wire to the port.
build_unflags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -std=gnu++11
build_flags =
  -std=gnu++17
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DBOARD_HAS_PSRAM
  -DMODEL_ID=\"reterminal-e1002\"
  -DCORE_DEBUG_LEVEL=1
  ; PNGdec's row buffer: two rows of an 800-pixel RGBA image (its default fits 320)
  -DPNG_MAX_BUFFERED_PIXELS=6402
lib_deps =
  ${env.lib_deps}
  zinggjm/GxEPD2@1.6.9
  bitbank2/PNGdec@1.1.6
  adafruit/Adafruit GFX Library@1.12.6
  h2zero/NimBLE-Arduino@2.5.1

; What the release workflow builds (.github/workflows/firmware.yml, docs/ota.md): no
; serial console, and it updates itself from the firmware feed.
[env:release]
extends = env:reterminal_e1002
build_flags =
  ${env:reterminal_e1002.build_flags}
  -DINKFRAME_CONSOLE=0
  -DINKFRAME_AUTO_UPDATE=1

; The pure logic (schedule, photo list, firmware updates), tested on the computer.
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<core/>
build_flags = -std=c++17 -DUNITY_INCLUDE_DOUBLE
