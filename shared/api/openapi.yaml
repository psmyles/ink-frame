openapi: 3.1.0
info:
  title: Ink Frame frame-project API
  version: 2.0.0
  description: |
    Contract for the two Edge Functions deployed into every frame's Supabase project
    (PLAN.md §7.3, §7.4). **One project holds one frame.** The functions,
    `tools/frame_sim`, the Dart client and the firmware all follow this file. Change it
    first, then the code on both sides.

    **device-api** is called by the frame hardware (and `frame_sim`). A frame knows only
    `api_base_url` (delivered over BLE, e.g. `https://<ref>.supabase.co/functions/v1`)
    and its device secret. Storage reaches it only as opaque signed URLs.

    **app-api** is called by the app with the user's Supabase Auth JWT. It handles every
    write. Reads (the frame, members, images, quotas) go straight to PostgREST and
    Storage under RLS and are not part of this contract.

    Not covered here: the setup wizard describes the frame and adds its owner with SQL
    through the Management API (`private.setup_frame`, `private.set_owner`; PLAN.md §6.2).

    Conventions:
    - JSON bodies, UTF-8. App timestamps are RFC 3339 strings; device timestamps are
      Unix seconds (the firmware has no date parser).
    - Every error response uses the `Error` schema. `error.code` is stable and meant
      for code; `error.message` is English text for logs.
    - No `apikey` header is needed: both functions run with `verify_jwt = false` and
      the gateway doesn't require one then (verified 2026-09-25). Clients may send it.
servers:
  - url: https://{project_ref}.supabase.co/functions/v1
    variables:
      project_ref:
        default: vrhsxzedzhvujnirsuhg
        description: The frame's project ref. The default is the dev project.

tags:
  - name: device
    description: device-api. Called by the frame hardware.
  - name: frame
    description: app-api. The frame's name, model, settings and hardware (owner).
  - name: images
    description: app-api. Upload, delete and reorder photos.
  - name: people
    description: app-api. Invites and members.
  - name: account
    description: app-api. The caller's own profile, account and usage.
  - name: internal
    description: app-api. Called by the project's own scheduled jobs, not by clients.

paths:
  # ───────────────────────────── device-api ─────────────────────────────
  /device-api/claim:
    post:
      tags: [device]
      operationId: claimFrame
      summary: Connect hardware to the frame with a one-time pairing token
      description: |
        Called by the hardware after it joins Wi-Fi during setup. `model_id` must be the
        frame's model (chosen at setup), else `409 model_mismatch`.

        - No hardware connected yet: this hardware becomes the frame's.
        - Same `hw_id` as connected (re-provisioning after holding the green button for
          3 s): a new secret; the old one stops working (`401`).
        - Different `hw_id` (replacement hardware of the same model): the new hardware
          takes over and keeps the photos. The old device's secret is tombstoned, so it
          gets `410` at its next sync and wipes itself.

        `device_secret` is 32 random bytes, base64url without padding, returned only
        here. The server stores its SHA-256.
      security: []
      parameters:
        - $ref: '#/components/parameters/ApiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pairing_token, hw_id, model_id, fw_version]
              properties:
                pairing_token: { $ref: '#/components/schemas/PairingToken' }
                hw_id: { $ref: '#/components/schemas/HwId' }
                model_id: { $ref: '#/components/schemas/ModelId' }
                fw_version: { $ref: '#/components/schemas/FwVersion' }
      responses:
        '200':
          description: Connected.
          content:
            application/json:
              schema:
                type: object
                required: [frame_id, device_secret]
                properties:
                  frame_id: { $ref: '#/components/schemas/Uuid' }
                  device_secret:
                    type: string
                    pattern: '^[A-Za-z0-9_-]{43}$'
                    description: 32 random bytes, base64url, no padding.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: '`invalid_pairing_token`: unknown, expired or already used.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: |
            `model_mismatch`: the hardware is a different model from the frame's.
            `error.details`: `frame_model`, `device_model`. The owner can switch the
            frame's model (`PATCH /app-api/frame`, clears the photos) and try again.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: '`unknown_model`: `model_id` is not in `device_models`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /device-api/sync:
    post:
      tags: [device]
      operationId: syncFrame
      summary: Report status and fetch settings and the photo manifest
      description: |
        Called on every scheduled or forced sync. Updates the heartbeat fields
        (`last_seen_at`, `fw_version`, `battery_pct`, `rssi`, `sd_free_bytes`).

        - `settings` is always returned.
        - `images` is omitted when the request's `manifest_version` equals the current
          one. Send `0` to force the full list (e.g. after the SD cache was lost).
        - When present, `images` is the complete manifest, sorted by `position`
          ascending. The frame mirrors it exactly: download what it lacks, delete
          what is not listed.
        - `url` (signed, valid 1 h) is included only for ids **not** in `local_ids`.

        A disconnected or replaced device gets `410`; the backend keeps a tombstone of
        the secret hash so it can tell "removed" (`410`) from "never valid" (`401`).
      security:
        - deviceSecret: []
      parameters:
        - $ref: '#/components/parameters/ApiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [manifest_version, fw_version, local_ids]
              properties:
                manifest_version:
                  type: integer
                  format: int64
                  minimum: 0
                  description: The version the frame last applied; `0` if none.
                fw_version: { $ref: '#/components/schemas/FwVersion' }
                battery_pct:
                  type: [integer, 'null']
                  minimum: 0
                  maximum: 100
                rssi:
                  type: [integer, 'null']
                  minimum: -127
                  maximum: 0
                  description: Wi-Fi signal in dBm.
                sd_free_bytes:
                  type: [integer, 'null']
                  format: int64
                  minimum: 0
                local_ids:
                  type: array
                  maxItems: 2000
                  uniqueItems: true
                  description: Ids of the images fully present in the frame's SD cache.
                  items: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Current settings and, if changed, the manifest.
          content:
            application/json:
              schema:
                type: object
                required: [manifest_version, settings, server_time]
                properties:
                  manifest_version:
                    type: integer
                    format: int64
                    minimum: 1
                  settings: { $ref: '#/components/schemas/DeviceSettings' }
                  images:
                    type: array
                    items: { $ref: '#/components/schemas/ManifestImage' }
                  server_time:
                    type: integer
                    format: int64
                    description: Unix seconds. A fallback if NTP fails.
              example:
                manifest_version: 42
                settings:
                  image_interval_s: 14400
                  display_order: random
                  sync_interval_s: 86400
                  quiet_start: '22:00'
                  quiet_end: '07:00'
                  tz_posix: CET-1CEST,M3.5.0,M10.5.0/3
                images:
                  - id: 3f1c9a52-8d0e-4b7a-9c61-2a5e0f4d7b18
                    sha256: 9b74c9897bac770ffc029102a200c5de9b74c9897bac770ffc029102a200c5de
                    bytes: 61234
                    position: 1.0
                    url: https://vrhsxzedzhvujnirsuhg.supabase.co/storage/v1/object/sign/frame-images/3f1c9a52-8d0e-4b7a-9c61-2a5e0f4d7b18.png?token=eyJhbGciOi
                  - id: 7a0d2e44-1b3c-4f5e-8a9b-0c1d2e3f4a5b
                    sha256: 2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae
                    bytes: 58811
                    position: 2.0
                server_time: 1790000000
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: '`invalid_device_secret`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '410':
          description: '`frame_removed`: this device was disconnected or replaced. It wipes its cache and secret.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  # ────────────────────────────── app-api ───────────────────────────────
  /app-api/frame:
    patch:
      tags: [frame]
      operationId: updateFrame
      summary: Rename the frame or switch its panel model
      description: |
        Owner only. Send the fields to change.

        Changing `model_id` deletes **every photo** (they were made for the old panel)
        and disconnects the current hardware (it gets `410`). When photos exist this
        needs `clear_photos: true`, else `409 photos_would_be_cleared` with
        `error.details.images` = how many.
      security:
        - userJwt: []
      parameters:
        - $ref: '#/components/parameters/ApiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { $ref: '#/components/schemas/FrameName' }
                model_id: { $ref: '#/components/schemas/ModelId' }
                clear_photos:
                  type: boolean
                  default: false
      responses:
        '200':
          description: The frame after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Frame' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '409':
          description: '`photos_would_be_cleared`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: '`unknown_model`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /app-api/frame/settings:
    patch:
      tags: [frame]
      operationId: updateFrameSettings
      summary: Change the frame's settings
      description: |
        Owner only. Send only the fields to change. `quiet_start` and `quiet_end` must
        end up both set or both `null`; they may span midnight. Changes reach the frame
        at its next sync (`settings` is returned on every sync, so `manifest_version`
        is not bumped).
      security:
        - userJwt: []
      parameters:
        - $ref: '#/components/parameters/ApiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FrameSettingsPatch' }
      responses:
        '200':
          description: The frame after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Frame' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '422':
          description: '`unknown_timezone` or `quiet_hours_incomplete`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /app-api/pairing-tokens:
    post:
      tags: [frame]
      operationId: createPairingToken
      summary: Create a one-time token for connecting hardware
      description: |
        Owner only. Valid for 10 minutes and one claim. The app sends it to the hardware
        over BLE (or, in dev mode, to `frame_sim claim --token`).
      security:
        - userJwt: []
      parameters:
        - $ref: '#/components/parameters/ApiKey'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [pairing_token, expires_at]
                properties:
                  pairing_token: { $ref: '#/components/schemas/PairingToken' }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NotOwner' }

  /app-api/frame/disconnect:
    post:
      tags: [frame]
      operationId: disconnectFrame
      summary: Disconnect the hardware
      description: |
        Owner only. The connected device gets `410` at its next sync and wipes itself;
        the photos stay, ready for new hardware. Does nothing if none is connected.
      security:
        - userJwt: []
      parameters:
        - $ref: '#/components/parameters/ApiKey'
      responses:
        '204': { description: Disconnected. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NotOwner' }

  /app-api/images/request-upload:
    post:
      tags: [images]
      operationId: requestImageUpload
      summary: Reserve an image and get a signed upload URL
      description: |
        Members. Checks that `width`×`height` equal the frame model's resolution,
        `bytes` ≤ 524288, and quotas (frame, user). Then inserts a `pending` row and
        returns a signed upload URL for `frame-images/{image_id}.png`.

        Upload with `PUT upload_url`, `Content-Type: image/png`, body = the PNG bytes.
        Then call `/app-api/images/finalize`.

        Dedupe on `sha256`:
        - a `ready` image with this hash exists → `409 duplicate_image`, with its id in
          `error.details.image_id`
        - a `pending` one exists (an earlier upload failed) → the same `image_id` with
          a fresh URL
      security:
        - userJwt: []
      parameters:
        - $ref: '#/components/parameters/ApiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sha256, bytes, width, height]
              properties:
                sha256: { $ref: '#/components/schemas/Sha256' }
                bytes:
                  type: integer
                  minimum: 1
                  maximum: 524288
                width: { type: integer, minimum: 1, maximum: 4096 }
                height: { type: integer, minimum: 1, maximum: 4096 }
      responses:
        '200':
          description: Upload URL issued.
          content:
            application/json:
              schema:
                type: object
                required: [image_id, upload_url, expires_at]
                properties:
                  image_id: { $ref: '#/components/schemas/Uuid' }
                  upload_url:
                    type: string
                    format: uri
                    description: Signed Storage upload URL. Opaque to the client.
                  expires_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NotMember' }
        '409':
          description: '`duplicate_image`: already on the frame. `error.details.image_id` is the existing id.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '413':
          description: '`too_large`: `bytes` over 524288.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: |
            `dimension_mismatch` (details: `expected_width`, `expected_height`) or
            `quota_exceeded` (details: `scope` = frame|user, `limit`, `used`,
            `unit` = images|bytes).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /app-api/images/finalize:
    post:
      tags: [images]
      operationId: finalizeImage
      summary: Verify an uploaded image and publish it to the frame
      description: |
        Only the uploader. Checks that the object exists, its size equals `bytes`, it
        starts with the PNG signature, and its IHDR width/height match. Then marks it
        `ready`, gives it the last `position`, and bumps the frame's
        `manifest_version`. Calling it again on a `ready` image returns the image
        unchanged.

        On `invalid_png` or `size_mismatch` the object and row are deleted; start again
        with `request-upload`.
      security:
        - userJwt: []
      parameters:
        - $ref: '#/components/parameters/ApiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [image_id]
              properties:
                image_id: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Image' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`not_member` or `not_uploader`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: '`image_not_found`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: '`not_uploaded`: no object at the upload path yet.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: '`invalid_png` or `size_mismatch`. The pending image is removed.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /app-api/images/delete:
    post:
      tags: [images]
      operationId: deleteImages
      summary: Delete one or more images
      description: |
        All-or-nothing. Each image must be the caller's own, or the caller must be the
        owner; otherwise nothing is deleted and the response is `403`. Deletes rows and
        objects and bumps `manifest_version`. Ids that no longer exist are ignored (so a
        retry succeeds).
      security:
        - userJwt: []
      parameters:
        - $ref: '#/components/parameters/ApiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [image_ids]
              properties:
                image_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted_ids]
                properties:
                  deleted_ids:
                    type: array
                    items: { $ref: '#/components/schemas/Uuid' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`not_member`, or `not_allowed`: at least one image is someone else''s and the caller isn''t the owner. `error.details.image_ids` lists them.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /app-api/images/reorder:
    post:
      tags: [images]
      operationId: reorderImage
      summary: Move one image to a new place in the frame's order
      description: |
        Owner only. Places `image_id` directly after `after_image_id`, or first when
        that is `null`. The server sets `position` to the midpoint of its new neighbours
        (renumbering 1, 2, 3… when the gap gets too small) and bumps `manifest_version`.
      security:
        - userJwt: []
      parameters:
        - $ref: '#/components/parameters/ApiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [image_id, after_image_id]
              properties:
                image_id: { $ref: '#/components/schemas/Uuid' }
                after_image_id:
                  oneOf:
                    - { $ref: '#/components/schemas/Uuid' }
                    - { type: 'null' }
                  description: Must be a `ready` image, or `null` for first.
      responses:
        '200':
          description: Moved. Returns the moved image with its new position.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Image' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404':
          description: '`image_not_found`: either image is missing or not `ready`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /app-api/invites:
    post:
      tags: [people]
      operationId: createInvite
      summary: Create an invite code
      description: |
        Owner only. Accepting makes the invitee a member of this frame.

        The code is 10 characters of Crockford base32, shown as `XXXXX-XXXXX`
        (hyphen and case ignored on input). Only its hash is stored, so it is returned
        just once. The app builds the join link (PLAN.md §5.5).
      security:
        - userJwt: []
      parameters:
        - $ref: '#/components/parameters/ApiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                max_uses:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 1
                expires_in_s:
                  type: integer
                  minimum: 3600
                  maximum: 2592000
                  default: 604800
                  description: Default 7 days, max 30.
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [invite_id, code, expires_at, max_uses]
                properties:
                  invite_id: { $ref: '#/components/schemas/Uuid' }
                  code:
                    type: string
                    pattern: '^[0-9A-HJKMNP-TV-Z]{5}-[0-9A-HJKMNP-TV-Z]{5}$'
                  expires_at: { type: string, format: date-time }
                  max_uses: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NotOwner' }

  /app-api/invites/{invite_id}:
    parameters:
      - name: invite_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    delete:
      tags: [people]
      operationId: revokeInvite
      summary: Revoke an invite
      description: Owner only.
      security:
        - userJwt: []
      parameters:
        - $ref: '#/components/parameters/ApiKey'
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404':
          description: '`invite_not_found`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /app-api/invites/accept:
    post:
      tags: [people]
      operationId: acceptInvite
      summary: Join the frame with an invite code
      description: |
        The one app-api call that does **not** require an existing `members` row: a
        freshly signed-in user calls it to join. `display_name` is required when the
        caller is not yet a member, and ignored otherwise (use `PATCH /app-api/me`).
        Unknown, expired, revoked and used-up codes all give the same `404`, so the
        response doesn't reveal which codes exist.
      security:
        - userJwt: []
      parameters:
        - $ref: '#/components/parameters/ApiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 10
                  maxLength: 16
                  description: Case-insensitive; hyphens and spaces ignored.
                display_name: { $ref: '#/components/schemas/DisplayName' }
      responses:
        '200':
          description: Joined (or already a member).
          content:
            application/json:
              schema:
                type: object
                required: [role]
                properties:
                  role: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404':
          description: '`invalid_invite`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: '`display_name_required`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /app-api/members/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    delete:
      tags: [people]
      operationId: removeMember
      summary: Remove someone from the frame, or leave it
      description: |
        The owner removes a member, or a member removes themselves. The owner can't be
        removed (deleting the frame is done through the Management API). The person's
        photos stay; the owner can delete them. Their auth user is removed by the hourly
        clean-up.
      security:
        - userJwt: []
      parameters:
        - $ref: '#/components/parameters/ApiKey'
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`not_member`, `not_allowed` or `cannot_remove_owner`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: '`member_not_found`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /app-api/me:
    patch:
      tags: [account]
      operationId: updateMe
      summary: Change your display name on this frame
      security:
        - userJwt: []
      parameters:
        - $ref: '#/components/parameters/ApiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name]
              properties:
                display_name: { $ref: '#/components/schemas/DisplayName' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [user_id, display_name, role]
                properties:
                  user_id: { $ref: '#/components/schemas/Uuid' }
                  display_name: { $ref: '#/components/schemas/DisplayName' }
                  role: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NotMember' }
    delete:
      tags: [account]
      operationId: deleteMe
      summary: Leave the frame and delete your account in its project
      description: |
        Required by the App Store. Deletes the caller's membership and auth user in this
        frame's project. With `delete_photos=true` (the app's "Also delete my photos"
        checkbox) every photo they uploaded is deleted and `manifest_version` bumped;
        otherwise the photos stay with `uploaded_by` set to `null`.

        The owner gets `409 owner_must_delete_frame`: for them, deleting their account
        means deleting the whole frame, which the app does through the Management API
        after a warning (PLAN.md §7.4).
      security:
        - userJwt: []
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - name: delete_photos
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Also delete every photo the caller uploaded.
      responses:
        '204': { description: Deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NotMember' }
        '409':
          description: '`owner_must_delete_frame`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /app-api/usage:
    get:
      tags: [account]
      operationId: getUsage
      summary: Storage usage and limits
      description: |
        The frame's totals against its limits and the Supabase free-tier storage, and
        per-person entries (everyone for the owner, only yourself for members). A `null`
        limit means unlimited.
      security:
        - userJwt: []
      parameters:
        - $ref: '#/components/parameters/ApiKey'
      responses:
        '200':
          description: Usage.
          content:
            application/json:
              schema:
                type: object
                required: [frame, users]
                properties:
                  frame:
                    allOf:
                      - { $ref: '#/components/schemas/UsageEntry' }
                      - type: object
                        required: [free_tier_bytes]
                        properties:
                          free_tier_bytes: { type: integer, format: int64 }
                  users:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/UsageEntry' }
                        - type: object
                          required: [user_id]
                          properties:
                            user_id: { $ref: '#/components/schemas/Uuid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NotMember' }

  /app-api/internal/maintenance:
    post:
      tags: [internal]
      operationId: runMaintenance
      summary: Hourly sweep of orphaned storage objects
      description: |
        Called hourly by `pg_cron` through `pg_net`. Deletes objects in `frame-images`
        older than 1 h that no `images` row points to: uploads whose `pending` row the
        SQL clean-up removed after 24 h, and anything left behind when an object delete
        failed after its row was deleted. Storage objects can't be deleted with SQL
        (Supabase's `protect_objects_delete` trigger), which is why this isn't a pure
        SQL job (PLAN.md §7.5).
      security:
        - maintenanceSecret: []
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                type: object
                required: [deleted_objects]
                properties:
                  deleted_objects: { type: integer }
        '401':
          description: '`unauthenticated`: missing or wrong secret.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

components:
  securitySchemes:
    deviceSecret:
      type: http
      scheme: bearer
      description: The hardware's `device_secret` from `/device-api/claim`. Not a JWT.
    userJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase Auth access token from Google/Apple ID-token sign-in on this frame's
        project. Every call except `/app-api/invites/accept` also needs a `members` row
        (`403 not_member` otherwise).
    maintenanceSecret:
      type: apiKey
      in: header
      name: x-maintenance-secret
      description: Random secret generated by the migrations and stored in `private.config`; only the database and the function (service role) can read it.

  parameters:
    ApiKey:
      name: apikey
      in: header
      required: false
      description: The project's public key (legacy anon JWT or `sb_publishable_…`). Not required; accepted if sent.
      schema: { type: string }

  responses:
    BadRequest:
      description: '`invalid_request`: malformed JSON or a field fails validation. `error.details.field` names it.'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthenticated:
      description: '`unauthenticated`: missing, invalid or expired JWT.'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotMember:
      description: '`not_member`.'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotOwner:
      description: '`not_member` or `not_owner`.'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, snake_case. Listed on each response.
              examples: [frame_removed]
            message: { type: string }
            details:
              type: object
              additionalProperties: true
      example:
        error:
          code: dimension_mismatch
          message: Image is 1024x768; this frame needs 800x480.
          details: { expected_width: 800, expected_height: 480 }

    Uuid:
      type: string
      format: uuid
    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: Lowercase hex SHA-256 of the PNG bytes.
    HwId:
      type: string
      pattern: '^[A-Za-z0-9:_-]{4,64}$'
      description: Stable hardware id, e.g. the ESP32 base MAC.
      examples: ['e1002-24ec4a1b2c3d']
    ModelId:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{1,63}$'
      description: A `device_models.id`.
      examples: [reterminal-e1002]
    FwVersion:
      type: string
      maxLength: 32
      examples: ['1.0.0']
    PairingToken:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      description: 128 random bits, Crockford base32 uppercase. One use, 10 minutes.
    FrameName:
      type: string
      minLength: 1
      maxLength: 40
      description: Trimmed by the server.
    DisplayName:
      type: string
      minLength: 1
      maxLength: 40
      description: Trimmed by the server.
    Role:
      type: string
      enum: [owner, member]
      description: Exactly one `owner` per frame.
    DisplayOrder:
      type: string
      enum: [random, sequential]
    LocalTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: '`HH:MM`, 24-hour, in the frame''s timezone.'
    NullableLocalTime:
      oneOf:
        - { $ref: '#/components/schemas/LocalTime' }
        - { type: 'null' }

    DeviceSettings:
      type: object
      required: [image_interval_s, display_order, sync_interval_s, quiet_start, quiet_end, tz_posix]
      properties:
        image_interval_s: { type: integer }
        display_order: { $ref: '#/components/schemas/DisplayOrder' }
        sync_interval_s: { type: integer }
        quiet_start: { $ref: '#/components/schemas/NullableLocalTime' }
        quiet_end: { $ref: '#/components/schemas/NullableLocalTime' }
        tz_posix:
          type: string
          description: POSIX TZ string for `setenv("TZ")`, derived from the IANA timezone.

    ManifestImage:
      type: object
      required: [id, sha256, bytes, position]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        sha256: { $ref: '#/components/schemas/Sha256' }
        bytes: { type: integer }
        position: { type: number, format: double }
        url:
          type: string
          format: uri
          description: Signed download URL, valid 1 hour. Only for ids not in `local_ids`.

    Image:
      type: object
      required: [id, uploaded_by, sha256, bytes, width, height, position, status, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        uploaded_by:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
          description: '`null` once the uploader''s account is deleted.'
        sha256: { $ref: '#/components/schemas/Sha256' }
        bytes: { type: integer }
        width: { type: integer }
        height: { type: integer }
        position: { type: number, format: double }
        status:
          type: string
          enum: [pending, ready]
        created_at: { type: string, format: date-time }

    Frame:
      type: object
      required: [id, name, model_id, connected, image_interval_s, display_order, sync_interval_s,
                 quiet_start, quiet_end, timezone]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { $ref: '#/components/schemas/FrameName' }
        model_id: { $ref: '#/components/schemas/ModelId' }
        connected:
          type: boolean
          description: Whether hardware is connected.
        fw_version: { type: [string, 'null'] }
        last_seen_at: { type: [string, 'null'], format: date-time }
        battery_pct: { type: [integer, 'null'] }
        image_interval_s: { type: integer }
        display_order: { $ref: '#/components/schemas/DisplayOrder' }
        sync_interval_s: { type: integer }
        quiet_start: { $ref: '#/components/schemas/NullableLocalTime' }
        quiet_end: { $ref: '#/components/schemas/NullableLocalTime' }
        timezone:
          type: string
          description: IANA name, e.g. `Europe/Berlin`.

    FrameSettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        image_interval_s:
          type: integer
          minimum: 3600
          maximum: 172800
          description: 1 hour to 2 days. Default 14400 (4 hours).
        display_order: { $ref: '#/components/schemas/DisplayOrder' }
        sync_interval_s:
          type: integer
          minimum: 3600
          maximum: 172800
          description: 1 hour to 2 days. Default 86400 (24 hours).
        quiet_start: { $ref: '#/components/schemas/NullableLocalTime' }
        quiet_end: { $ref: '#/components/schemas/NullableLocalTime' }
        timezone:
          type: string
          maxLength: 64
          description: IANA name; must be in the bundled timezone table.

    UsageEntry:
      type: object
      required: [images, bytes, max_images, max_bytes]
      properties:
        images: { type: integer }
        bytes: { type: integer, format: int64 }
        max_images: { type: [integer, 'null'] }
        max_bytes: { type: [integer, 'null'], format: int64 }
