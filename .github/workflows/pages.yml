# Publishes central/site/ (the /join and /oauth pages) to GitHub Pages, with the
# firmware feed: the newest fw-v* release's manifest and image under firmware/<model>/
# (docs/ota.md; the Firmware workflow starts this after a release). Needs Settings →
# Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths: ["central/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno test central/tests/
      - name: Firmware feed (the newest fw-v* release)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag=$(gh release list --limit 50 --json tagName,isDraft,isPrerelease \
            --jq '[.[] | select(.tagName | startswith("fw-v")) | select((.isDraft or .isPrerelease) | not)][0].tagName // empty')
          if [ -z "$tag" ]; then echo "No firmware release yet"; exit 0; fi
          mkdir -p release && gh release download "$tag" --dir release --pattern '*-manifest.json' --pattern '*.bin'
          for m in release/*-manifest.json; do
            model=$(basename "$m" -manifest.json)
            v=$(jq -r .version "$m")
            mkdir -p "central/site/firmware/$model"
            cp "$m" "central/site/firmware/$model/manifest.json"
            cp "release/$model-$v.bin" "central/site/firmware/$model/$v.bin"
            echo "Feed: $model $v ($tag)"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: central/site }
      - id: deployment
        uses: actions/deploy-pages@v4
